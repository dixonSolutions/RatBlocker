name: Deploy site to GitHub Pages

on:
  push:
    branches: [master, main]
    paths:
      - 'site/**'
      - 'design/**'
      - 'filter-lists/**'
      - 'core/**'
      - 'filter-compiler/**'
      - 'extensions/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Pages needs these; nothing here writes to the repository.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. Queued rather than cancelled, so a push during a
# deploy still ends up published rather than being silently dropped.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The site's rule counts, database sizes and list versions are generated
      # from the filter compiler's own output, so the compiler has to run
      # before the site is built. It is also a free correctness check: if the
      # lists stop compiling, the site fails rather than publishing stale
      # numbers.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build the filter compiler
        run: cargo build --release -p ratblocker-filter-compiler

      - name: Compile filter lists
        run: |
          ./target/release/ratblocker-compile build \
            --list easylist=filter-lists/bundled/easylist.txt \
            --list easyprivacy=filter-lists/bundled/easyprivacy.txt \
            --out dist

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The extensions are published alongside the site so that a store-free
      # install has somewhere to install *from*. This matters most on Windows
      # and macOS: Chrome refuses off-store external installs there, so policy
      # is the only route, and policy names a URL rather than a file. Pages is
      # that URL, over HTTPS, at no cost.
      - name: Build the WebAssembly engine
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build --release -p ratblocker-wasm --target wasm32-unknown-unknown

      - name: Install extension dependencies
        working-directory: extensions
        run: npm ci

      - name: Build and test the extensions
        working-directory: extensions
        run: |
          npm run typecheck
          npm test
          node build.mjs

      # Packing a CRX needs the signing key, because the extension id is
      # derived from it: a different key means a different id, which orphans
      # every existing install. It lives in a secret rather than the
      # repository. Without it the site still publishes, just without the
      # Chromium artefacts, rather than failing the whole deploy.
      - name: Package the extensions
        working-directory: extensions
        env:
          CHROMIUM_SIGNING_KEY: ${{ secrets.CHROMIUM_SIGNING_KEY }}
          RATBLOCKER_UPDATE_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/downloads
        run: |
          if [ -n "$CHROMIUM_SIGNING_KEY" ]; then
            printf '%s' "$CHROMIUM_SIGNING_KEY" | base64 -d > ../chromium-signing-key.pem
            node package.mjs
          else
            echo "::warning::CHROMIUM_SIGNING_KEY is not set; publishing the XPI only."
            node package.mjs firefox
          fi

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      # Derive the base href from the repository name so the site keeps working
      # if the repository is renamed, and so a fork does not have to edit
      # angular.json to deploy its own copy.
      - name: Build the site
        working-directory: site
        run: npm run build -- --base-href "/${GITHUB_REPOSITORY#*/}/"

      # Everything a browser polls for updates, served from one place.
      - name: Publish the downloads
        run: |
          out=site/dist/site/browser/downloads
          mkdir -p "$out"
          for f in dist/ratblocker-chromium.crx dist/chromium-update.xml \
                   dist/ratblocker-firefox-*.xpi dist/firefox-updates.json \
                   dist/ATTRIBUTION.txt; do
            [ -e "$f" ] && cp "$f" "$out/" || true
          done
          # The policy artefacts and external-extension descriptors, so an
          # administrator can fetch exactly what their platform reads.
          [ -d dist/policy ] && cp -r dist/policy "$out/policy" || true
          for f in dist/*.json; do
            case "$(basename "$f")" in
              metadata.json) ;;
              *) cp "$f" "$out/" ;;
            esac
          done
          ls -la "$out"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist/site/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
