<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!--
    Only the daemon's own account may own the bus name. Anyone may call the
    interface: whether a call is permitted is decided by Polkit inside the
    daemon, not by who managed to reach the bus (§8).
  -->
  <policy user="ratblocker">
    <allow own="io.github.ratblocker.Service"/>
  </policy>

  <policy context="default">
    <allow send_destination="io.github.ratblocker.Service"
           send_interface="io.github.ratblocker.Service1"/>
    <allow send_destination="io.github.ratblocker.Service"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="io.github.ratblocker.Service"
           send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="io.github.ratblocker.Service"
           send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
