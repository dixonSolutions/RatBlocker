[package]
name = "ratblocker-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "RatBlocker system filtering daemon for Linux."

[lib]
name = "ratblocker_daemon"
path = "src/lib.rs"

[[bin]]
name = "ratblockerd"
path = "src/main.rs"

[[bin]]
name = "ratblocker-helper"
path = "src/helper.rs"

[dependencies]
ratblocker-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "fs", "io-util"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
zbus_polkit = "5"
serde_yaml_ng = "0.10"
postcard = { version = "1", features = ["use-std"] }
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
ed25519-dalek = { version = "2", default-features = false, features = ["std", "pkcs8"] }
base64 = "0.22"
