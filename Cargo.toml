[workspace]
resolver = "2"
members = [
    "core",
    "filter-compiler",
    "tests",
    "extensions/shared/wasm",
]

[workspace.package]
version = "0.1.9"
edition = "2021"
rust-version = "1.82"
license = "GPL-3.0-or-later"
repository = "https://github.com/ratblocker/ratblocker"

[workspace.dependencies]
ratblocker-core = { path = "core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
