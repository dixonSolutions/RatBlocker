<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320"
     role="img" aria-label="RatBlocker — local, private ad and tracker blocking.">
  <title>RatBlocker</title>

  <!--
    Authoritative source for design/banner.png. The rat is defined once in
    design/icon.svg (id="rat", fill="currentColor") and reused here in white
    on the dark field, so the mark stays in sync with the icon by construction
    rather than by hand. Edit the rat in design/icon.svg (or the
    reference image design/reference-rat.png) and re-run the render
    command in design/README.md. A single mark, once — no faded echo.
  -->

  <rect width="1280" height="320" fill="#2a0f1c"/>

  <use href="icon.svg#rat" color="#ffffff" transform="translate(120 64) scale(1.5)"/>

  <g font-family="Lato, 'DejaVu Sans', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="360" y="188" font-size="96" font-weight="700" letter-spacing="-2.5"
          fill="#ffffff">RatBlocker</text>
    <rect x="362" y="208" width="72" height="5" rx="2.5" fill="#e0698a"/>
    <text x="360" y="250" font-size="34" fill="#e6b3c3">Local, private ad and tracker blocking.</text>
  </g>
</svg>
